name: Node.js CI

on:
  push:
    branches:
      - feature/nodejs-backend
  pull_request:
    branches:
      - development/production-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
