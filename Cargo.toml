[package]
name = "ccl-server"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Friday the 13th private server backend"
repository = "https://github.com/khaled934533-source/f13-custom-backend"
authors = ["KLAY"]

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

bytes = "1"
thiserror = "2"

[[bin]]
name = "ccl-server"
path = "src/main.rs"